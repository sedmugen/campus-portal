spring.application.name=campusportal

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (Development default: MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_portal_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.saad.campusportal=DEBUG